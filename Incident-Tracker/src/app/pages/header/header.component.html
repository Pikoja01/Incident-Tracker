<div class="parent">
    <div class="sidebar">
        <div>
            <h4>Dashboard</h4>
            <a routerLink="dashboard">Home</a>
            @if (loggedUserData.role == 'IncidentAdmin') {
                <a routerLink="users">Users</a>
            }
            @if (loggedUserData.role == 'User') {
                <a routerLink="create-new">Create New</a>
            }
            <a routerLink="incident-list">Incident List</a>
        </div>
        <div>
            <p>Logged in as: <strong>{{loggedUserData.userName}}</strong></p>
            <button (click)="logOff()" type="button" class="btn btn-danger w-100">Log Off</button>
        </div>
    </div>
    <div class="content">
        <router-outlet></router-outlet>
    </div>
</div>
